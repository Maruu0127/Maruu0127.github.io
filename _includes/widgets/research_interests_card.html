{% if site.data.profile.research_interests %}
<div class="row">
    <div class="col">
        <div class="card border-0 shadow-sm bg-white">
            <div class="card-body p-4">
                <div class="row px-3 pt-3">
                    <div class="col h3">
                        Research Interests
                    </div>
                </div>
                <div class="row p-3">
                    <div class="col">
                        <ul class="text-profile-bio mt-0 mb-0 pl-4">
                            {% for interest in site.data.profile.research_interests %}
                            <li class="mb-2">{{ interest }}</li>
                            {% endfor %}
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endif %}
