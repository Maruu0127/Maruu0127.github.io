short_bio_text_justify: true
short_bio: >-
  <p>
    My research aims to develop <strong>spatial intelligence</strong> for real-world, safety-critical
    environments. I focus on <strong>3D Gaussian Splatting</strong>, from feed-forward reconstruction
    to post-hoc per-scene optimization, and on making such representations efficient enough to deploy.
    I am also interested in industrial and multimodal anomaly detection via distillation-based
    teacher–student frameworks, and in extending this notion of deviation from learned normality
    beyond 2D images to 3D scene representations.
  </p>

