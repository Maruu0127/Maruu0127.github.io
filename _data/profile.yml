short_bio_text_justify: true
short_bio: >-
  <p>
    I am an M.S. student in Computer Science at Kyonggi University, advised by Prof. Junho Ahn.
    My research aims to develop <strong>robust perception for real-world, safety-critical environments</strong>
    through <strong>multimodal representation learning</strong> with computer vision and vision–language models.
  </p>
  <p>
    I am particularly interested in spatial recognition and autonomous-driving perception via
    multi-sensor fusion (RGB, LiDAR, Radar). I also study industrial and cross-modal
    <strong>anomaly detection</strong> via distillation-based teacher–student frameworks.
  </p>

