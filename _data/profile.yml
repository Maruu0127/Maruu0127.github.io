short_bio_text_justify: true
short_bio: >-
  <p>
    I am a graduate student researching <strong>anomaly detection</strong> and
    <strong>multi-modal learning</strong> for <strong>industrial quality inspection</strong>.
    My current work develops <em>cross-modal anomaly detection</em> models that jointly learn from
    heterogeneous modalities (e.g., RGB and X-ray) to detect defects that are difficult to capture
    from any single modality alone.
  </p>
  <p>
    I am broadly interested in unsupervised representation learning, computer vision, and building
    reliable models for real-world manufacturing. My goal is to publish this research in
    top-tier journals such as ESWA and EAAI.
  </p>

