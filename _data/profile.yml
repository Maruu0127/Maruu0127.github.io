short_bio_text_justify: true
short_bio: >-
  <p>
    My research is in <strong>computer vision</strong>, spanning 3D reconstruction, unsupervised
    visual inspection, and scene understanding. A common thread is improving a system
    <strong>with something held fixed</strong> — a pretrained backbone, a sensor, or a compute
    budget — as in my post-hoc compaction plug-ins for feed-forward
    <strong>3D Gaussian Splatting</strong> backbones and unsupervised anomaly detection for camera
    lens actuator modules under X-ray and visible-light imaging.
  </p>
  <p style="border-left: 3px solid #007bff; background-color: #f8f9fa; padding: 0.75rem 1rem; border-radius: 0.4rem; margin-bottom: 0;">
    I am applying for full-time M.S. programs starting March 2027, and I am looking for labs
    working on computer vision, from 3D reconstruction to imaging systems.
  </p>

